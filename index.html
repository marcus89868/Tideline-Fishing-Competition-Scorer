      /* =========================================================
         TAB 3: AUDIT LOG (INTEGRITY VIEW)
      ========================================================= */
      function renderAuditTab(ds) {
        const anglerMap = new Map(ds.anglers.map(a => [a.id, a]));
        const allCatches = ds.catches;
        const activeCount = allCatches.filter(c => c.status !== 'voided').length;
        const editedCount = allCatches.filter(c => c.status !== 'voided' && c.auditTrail && c.auditTrail.some(t => t.action === 'edited')).length;
        const voidedCount = allCatches.filter(c => c.status === 'voided').length;

        const q = uiState.auditSearch.trim().toLowerCase();
        const filtered = allCatches
          .filter(c => {
            if (uiState.auditFilter === 'ACTIVE') return c.status !== 'voided';
            if (uiState.auditFilter === 'EDITED') return c.auditTrail && c.auditTrail.some(t => t.action === 'edited');
            if (uiState.auditFilter === 'VOIDED') return c.status === 'voided';
            return true;
          })
          .filter(c => {
            if (!q) return true;
            const ang = anglerMap.get(c.anglerId);
            const hay = [
              formatLogId(c.seq),
              ang ? ang.name : '',
              ang ? ang.badge : '',
              c.species || '',
              c.notes || '',
              c.voidReason || ''
            ].join(' ').toLowerCase();
            return hay.includes(q);
          })
          .sort((a, b) => {
            const diff = (Date.parse(a.timestamp) || 0) - (Date.parse(b.timestamp) || 0);
            return uiState.auditSort === 'desc' ? -diff : diff;
          });

        const listHtml = filtered.length === 0
          ? `
            <div class="empty-state">
              <h3>${allCatches.length === 0 ? 'Audit Ledger Empty' : 'No Matching Entries'}</h3>
              <p>${allCatches.length === 0 ? 'Every catch logged will appear here with exact measurements, timestamps, and marshal verification notes.' : 'Adjust your search or status filter to inspect other entries.'}</p>
            </div>
          `
          : `<div class="list-stack">${filtered.map(c => renderAuditCard(c, anglerMap.get(c.anglerId), true)).join('')}</div>`;

        return `
          <div class="export-bar">
            <button type="button" class="btn btn-dark" id="exportCsvBtn">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Export CSV</span>
            </button>
            <button type="button" class="btn btn-secondary" id="printSummaryBtn">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              <span>Print Summary</span>
            </button>
          </div>

          <div class="toolbar-row">
            <div class="search-box">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="search" id="auditSearchInput" class="input-field search-input" placeholder="Search log, angler, species, note..." value="${escapeHtml(uiState.auditSearch)}" />
            </div>
            <button type="button" class="btn btn-secondary" id="auditSortBtn" title="Toggle chronological order">
              ${uiState.auditSort === 'desc' ? 'Newest' : 'Oldest'}
            </button>
          </div>

          <div class="filter-strip" aria-label="Audit status filter">
            <button type="button" class="chip-btn ${uiState.auditFilter === 'ALL' ? 'active' : ''}" data-af="ALL">All (${allCatches.length})</button>
            <button type="button" class="chip-btn ${uiState.auditFilter === 'ACTIVE' ? 'active' : ''}" data-af="ACTIVE">Active (${activeCount})</button>
            <button type="button" class="chip-btn ${uiState.auditFilter === 'EDITED' ? 'active' : ''}" data-af="EDITED">Edited (${editedCount})</button>
            <button type="button" class="chip-btn ${uiState.auditFilter === 'VOIDED' ? 'active' : ''}" data-af="VOIDED">Voided (${voidedCount})</button>
          </div>

          ${listHtml}
        `;
      }

      function renderAuditCard(c, angler, showAnglerHeader) {
        const isVoided = c.status === 'voided';
        const edits = (c.auditTrail || []).filter(t => t.action === 'edited');
        const isEdited = edits.length > 0;

        let statusBadge = '<span class="status-pill status-active">Verified</span>';
        if (isVoided) {
          statusBadge = '<span class="status-pill status-voided">Voided · Excluded</span>';
        } else if (isEdited) {
          statusBadge = `<span class="status-pill status-edited">Edited (${edits.length})</span>`;
        }

        const trailHtml = (c.auditTrail && c.auditTrail.length > 0)
          ? `
            <div class="audit-trail-box ${isVoided ? 'void-box' : ''}">
              ${c.auditTrail.map(t => {
                if (t.action === 'voided') {
                  return `
                    <div class="audit-trail-item">
                      <strong>VOIDED</strong> (${escapeHtml(formatDateTime(t.timestamp))}): ${escapeHtml(t.reason)}
                    </div>
                  `;
                }
                const prev = t.previous
                  ? `Was ${formatLength(t.previous.lengthCm)} cm / ${formatWeight(t.previous.weightKg)} kg${t.previous.species ? ' · ' + escapeHtml(t.previous.species) : ''}`
                  : '';
                return `
                  <div class="audit-trail-item">
                    <strong>EDITED</strong> (${escapeHtml(formatDateTime(t.timestamp))}): ${escapeHtml(t.reason)}
                    ${prev ? `<div style="margin-top:2px; opacity:0.85;">${prev}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `
          : '';

        const anglerRowHtml = showAnglerHeader
          ? `
            <div class="audit-angler-row">
              <button type="button" class="audit-angler-btn" data-jump-angler="${c.anglerId}">
                <span>${escapeHtml(angler ? angler.name : 'Unknown Angler')}</span>
                ${angler ? `<span class="badge-tag mono">#${escapeHtml(angler.badge)}</span>` : ''}
              </button>
              ${angler && angler.division ? `<span class="div-pill ${angler.division.toLowerCase() === 'junior' ? 'junior' : ''}">${escapeHtml(angler.division)}</span>` : ''}
            </div>
          `
          : '';

        const actionsHtml = !isVoided
          ? `
            <div class="audit-actions">
              <button type="button" class="btn btn-secondary btn-sm" data-edit-catch="${c.id}">Edit Entry</button>
              <button type="button" class="btn btn-danger-outline btn-sm" data-void-catch="${c.id}">Void Entry</button>
            </div>
          `
          : '';

        return `
          <article class="audit-card ${isVoided ? 'voided' : ''}">
            <div class="audit-top">
              <div class="audit-id-time">
                <span class="log-id mono">${escapeHtml(formatLogId(c.seq))}</span>
                <span class="tabular">${escapeHtml(formatDateTime(c.timestamp))}</span>
              </div>
              ${statusBadge}
            </div>

            <div class="audit-body ${isVoided ? 'struck' : ''}">
              ${anglerRowHtml}
              <div class="audit-metrics tabular">
                <div>
                  <div class="stat-cell-label">Length</div>
                  <div class="stat-cell-val">${formatLength(c.lengthCm)} cm</div>
                </div>
                <div>
                  <div class="stat-cell-label">Weight</div>
                  <div class="stat-cell-val">${formatWeight(c.weightKg)} kg</div>
                </div>
                <div>
                  <div class="stat-cell-label">Species</div>
                  <div class="stat-cell-val" style="font-size:13.5px;">${escapeHtml(c.species || '—')}</div>
                </div>
              </div>
              ${c.notes ? `<div class="audit-note">Marshal Note: ${escapeHtml(c.notes)}</div>` : ''}
            </div>

            ${trailHtml}
            ${actionsHtml}
          </article>
        `;
      }

      function bindAuditEvents() {
        const searchInput = document.getElementById('auditSearchInput');
        if (searchInput) {
          searchInput.addEventListener('input', e => {
            uiState.auditSearch = e.target.value;
            const pos = e.target.selectionStart;
            renderApp();
            const refreshed = document.getElementById('auditSearchInput');
            if (refreshed) {
              refreshed.focus();
              refreshed.setSelectionRange(pos, pos);
            }
          });
        }

        const sortBtn = document.getElementById('auditSortBtn');
        if (sortBtn) {
          sortBtn.addEventListener('click', () => {
            uiState.auditSort = uiState.auditSort === 'desc' ? 'asc' : 'desc';
            renderApp();
          });
        }

        document.querySelectorAll('[data-af]').forEach(btn => {
          btn.addEventListener('click', () => {
            uiState.auditFilter = btn.dataset.af;
            renderApp();
          });
        });

        const exportBtn = document.getElementById('exportCsvBtn');
        if (exportBtn) exportBtn.addEventListener('click', exportCsvBackup);

        const printBtn = document.getElementById('printSummaryBtn');
        if (printBtn) printBtn.addEventListener('click', openPrintSummaryModal);

        bindCatchCardActionButtons(document.getElementById('mainContent'));
      }

      function bindCatchCardActionButtons(container) {
        if (!container) return;
        container.querySelectorAll('[data-edit-catch]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            openEditCatchModal(btn.dataset.editCatch);
          });
        });
        container.querySelectorAll('[data-void-catch]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            openVoidCatchModal(btn.dataset.voidCatch);
          });
        });
        container.querySelectorAll('[data-jump-angler]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            openAnglerProfileDrawer(btn.dataset.jumpAngler);
          });
        });
      }

      /* =========================================================
         MODAL INFRASTRUCTURE
      ========================================================= */
      function openModal(html, onReady) {
        stopLiveClock();
        const backdrop = document.getElementById('modalBackdrop');
        const sheet = document.getElementById('modalSheet');
        sheet.innerHTML = html;
        backdrop.classList.add('open');

        sheet.querySelectorAll('[data-close-modal]').forEach(btn => {
          btn.addEventListener('click', closeModal);
        });

        if (onReady) onReady(sheet);
      }

      function closeModal() {
        stopLiveClock();
        document.getElementById('modalBackdrop').classList.remove('open');
        document.getElementById('modalSheet').innerHTML = '';
      }

      function stopLiveClock() {
        if (uiState.liveClockTimer) {
          clearInterval(uiState.liveClockTimer);
          uiState.liveClockTimer = null;
        }
      }

      /* =========================================================
         DRAWER: CATEGORY FULL LEADERBOARD
      ========================================================= */
      function openCategoryDrawer(categoryId) {
        const ds = getDataset();
        const cat = CATEGORIES.find(c => c.id === categoryId);
        if (!cat) return;

        const computed = computeAllStats(ds, uiState.divisionFilter);
        const lb = computed.leaderboards[categoryId];
        const divTag = uiState.divisionFilter === 'ALL' ? 'Overall Standings' : `${uiState.divisionFilter} Division`;

        const rankedHtml = lb.entries.length === 0
          ? `<div class="empty-state"><h3>No Qualifying Catches</h3><p>No active catches logged in this view yet.</p></div>`
          : lb.entries.map(e => {
              const placeClass = e.rank === 1 ? 'place-1' : (e.rank === 2 ? 'place-2' : '');
              const badgeClass = e.rank === 1 ? 'rank-1' : (e.rank === 2 ? 'rank-2' : 'rank-other');
              const rankText = e.rank === 1 ? '1ST' : (e.rank === 2 ? '2ND' : `#${e.rank}`);
              const divPillHtml = e.angler.division
                ? `<span class="div-pill ${e.angler.division.toLowerCase() === 'junior' ? 'junior' : ''}">${escapeHtml(e.angler.division)}</span>`
                : '';
              return `
                <button type="button" class="rank-list-item ${placeClass}" data-drawer-angler="${e.angler.id}">
                  <div class="podium-left">
                    <span class="rank-badge ${badgeClass}">${rankText}</span>
                    <div class="podium-angler-info">
                      <div class="podium-name-line">
                        <span class="podium-angler-name">${escapeHtml(e.angler.name)}</span>
                        <span class="badge-tag mono">#${escapeHtml(e.angler.badge)}</span>
                        ${divPillHtml}
                      </div>
                      <div class="podium-meta">
                        <span>${escapeHtml(e.meta)}</span>
                        ${e.tieBreakerApplied ? `<span class="tb-badge">${escapeHtml(e.tieBreakerReason)}</span>` : ''}
                      </div>
                    </div>
                  </div>
                  <div class="podium-score tabular">
                    <span class="score-value" style="font-size:18px;">${escapeHtml(e.primaryDisplay)}</span><span class="score-unit">${escapeHtml(e.unit)}</span>
                  </div>
                </button>
              `;
            }).join('');

        const unrankedHtml = lb.unranked.length > 0
          ? `
            <div style="margin-top:16px;">
              <div style="font-size:12px; font-weight:800; color:#3F667C; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;">
                Registered · No Active Catches (${lb.unranked.length})
              </div>
              ${lb.unranked.map(st => `
                <button type="button" class="rank-list-item" style="opacity:0.75;" data-drawer-angler="${st.angler.id}">
                  <div class="podium-left">
                    <span class="rank-badge rank-other">—</span>
                    <div class="podium-name-line">
                      <span class="podium-angler-name">${escapeHtml(st.angler.name)}</span>
                      <span class="badge-tag mono">#${escapeHtml(st.angler.badge)}</span>
                    </div>
                  </div>
                  <span style="font-size:12.5px; font-weight:700; color:#3F667C;">0 fish</span>
                </button>
              `).join('')}
            </div>
          `
          : '';

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">${escapeHtml(cat.title)}</h2>
              <div class="sheet-subtitle">${escapeHtml(divTag)} · Tap any angler to audit catches</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <div class="drawer-rule-box">
              <div><strong>Rule:</strong> ${escapeHtml(cat.ruleDesc)}</div>
              <div style="margin-top:3px;">${escapeHtml(cat.tieDesc)}</div>
            </div>
            ${rankedHtml}
            ${unrankedHtml}
          </div>
        `;

        openModal(html, sheet => {
          sheet.querySelectorAll('[data-drawer-angler]').forEach(btn => {
            btn.addEventListener('click', () => openAnglerProfileDrawer(btn.dataset.drawerAngler));
          });
        });
      }

      /* =========================================================
         DRAWER: ANGLER PROFILE & INDIVIDUAL CATCH LOG
      ========================================================= */
      function openAnglerProfileDrawer(anglerId) {
        const ds = getDataset();
        const angler = ds.anglers.find(a => a.id === anglerId);
        if (!angler) return;

        const computed = computeAllStats(ds, 'ALL');
        const st = computed.allAnglerStats.get(angler.id) || { count: 0, totalWeightKg: 0, totalLengthCm: 0 };
        const pm = computed.podiumMap.get(angler.id) || { ranks: {} };

        const anglerCatches = ds.catches
          .filter(c => c.anglerId === angler.id)
          .sort((a, b) => (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0));

        const voidedCount = anglerCatches.filter(c => c.status === 'voided').length;

        const standingsHtml = CATEGORIES.map(cat => {
          const r = pm.ranks[cat.id];
          const isTop2 = r && r.rank <= 2;
          return `
            <div class="mini-standing-card ${isTop2 ? 'top-2' : ''}">
              <div class="stat-cell-label">${escapeHtml(cat.shortTitle)}</div>
              <div style="display:flex; align-items:baseline; justify-content:space-between; gap:4px; margin-top:3px;">
                <strong class="tabular" style="font-size:14.5px;">${r ? (r.rank === 1 ? '1st' : r.rank === 2 ? '2nd' : '#' + r.rank) : '—'}</strong>
                <span class="tabular" style="font-size:12.5px; font-weight:700; color:#1D445B;">${r ? escapeHtml(r.value) : 'No catch'}</span>
              </div>
              ${r && r.tb ? `<div style="margin-top:3px;"><span class="tb-badge">${escapeHtml(r.tb)}</span></div>` : ''}
            </div>
          `;
        }).join('');

        const catchesHtml = anglerCatches.length === 0
          ? `<div class="empty-state"><h3>No Catches Logged</h3><p>Tap "+ Log Catch" below to record a fish for ${escapeHtml(angler.name)}.</p></div>`
          : `<div class="list-stack">${anglerCatches.map(c => renderAuditCard(c, angler, false)).join('')}</div>`;

        const profileSub = angler.division
          ? `Badge #${escapeHtml(angler.badge)} · ${escapeHtml(angler.division)} Division`
          : `Badge #${escapeHtml(angler.badge)}`;

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">${escapeHtml(angler.name)}</h2>
              <div class="sheet-subtitle">${profileSub}</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <div class="angler-stats-grid tabular" style="margin-bottom:10px; background:#003B5C; color:#FFFFFF; border-color:#003B5C;">
              <div>
                <div class="stat-cell-label" style="color:#A8D8EE;">Active Fish</div>
                <div class="stat-cell-val" style="color:#FFFFFF; font-size:18px;">${st.count}</div>
              </div>
              <div>
                <div class="stat-cell-label" style="color:#A8D8EE;">Combined Wt</div>
                <div class="stat-cell-val" style="color:#FFFFFF; font-size:18px;">${formatWeight(st.totalWeightKg)} kg</div>
              </div>
              <div>
                <div class="stat-cell-label" style="color:#A8D8EE;">Combined Len</div>
                <div class="stat-cell-val" style="color:#FFFFFF; font-size:18px;">${formatLength(st.totalLengthCm)} cm</div>
              </div>
            </div>
            <div style="font-size:12px; font-weight:600; color:#3F667C; margin-bottom:12px;">
              Totals computed from ${st.count} verified ${st.count === 1 ? 'catch' : 'catches'}${voidedCount > 0 ? ` (${voidedCount} voided excluded)` : ''}.
            </div>

            <div style="font-size:12px; font-weight:800; color:#3F667C; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;">
              Overall Category Standings
            </div>
            <div class="mini-standings">${standingsHtml}</div>

            <div style="font-size:12px; font-weight:800; color:#3F667C; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;">

            </div>
            ${catchesHtml}
          </div>
          <div class="sheet-footer">
            <button type="button" class="btn btn-secondary" id="editAnglerFromProfile">Edit Angler</button>

        openModal(html, sheet => {
          bindCatchCardActionButtons(sheet);
          sheet.querySelector('#editAnglerFromProfile').addEventListener('click', () => openAnglerFormModal(angler.id));
          sheet.querySelector('#logCatchForAngler').addEventListener('click', () => openLogCatchModal(angler.id));
        });
      }

      /* =========================================================
         MODAL: FAST-ENTRY CATCH LOGGING
      ========================================================= */
      function getSpeciesSuggestions(ds) {
        const set = new Set(DEFAULT_SPECIES);
        ds.catches.forEach(c => {
          if (c.species && c.species.trim()) set.add(c.species.trim());
        });
        return Array.from(set).slice(0, 12);
      }

      function openLogCatchModal(preselectedAnglerId) {
        const ds = getDataset();
        let selectedAngler = preselectedAnglerId
          ? ds.anglers.find(a => a.id === preselectedAnglerId) || null
          : null;

        const speciesList = getSpeciesSuggestions(ds);

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">Log Catch</h2>
              <div class="sheet-subtitle">Fast weigh-in &amp; brag-mat entry</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <form id="logCatchForm" class="sheet-body" novalidate>
            <div id="catchFormError" class="error-msg"></div>

            <div class="form-group">
              <label class="form-label" for="anglerComboInput">
                <span>Angler <span class="label-req">*</span></span>
                <span class="label-opt">Search name or badge #</span>
              </label>
              <div class="combo-wrap">
                <input type="text" id="anglerComboInput" class="input-field" placeholder="Tap to search angler..." autocomplete="off" value="${selectedAngler ? escapeHtml(selectedAngler.name + ' (#' + selectedAngler.badge + ')') : ''}" />
                <div id="anglerComboDropdown" class="combo-dropdown"></div>
              </div>
              <div id="selectedAnglerChip"></div>
            </div>

            <div class="two-col">
              <div class="form-group">
                <label class="form-label" for="catchLengthInput">
                  <span>Length (cm) <span class="label-req">*</span></span>
                </label>
                <input type="number" id="catchLengthInput" class="input-field big-num-input" inputmode="decimal" step="0.1" min="0.1" placeholder="e.g. 64.5" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="catchWeightInput">
                  <span>Weight (kg) <span class="label-req">*</span></span>
                </label>
                <input type="number" id="catchWeightInput" class="input-field big-num-input" inputmode="decimal" step="0.01" min="0.01" placeholder="e.g. 3.45" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="catchSpeciesInput">
                <span>Species</span>
                <span class="label-opt">Optional</span>
              </label>
              <input type="text" id="catchSpeciesInput" class="input-field" placeholder="Type or pick species below..." autocomplete="off" />
              <div class="preset-chips" id="speciesChips">
                ${speciesList.map(sp => `<button type="button" class="preset-chip" data-species="${escapeHtml(sp)}">${escapeHtml(sp)}</button>`).join('')}
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="catchNotesInput">
                <span>Verification Notes / Photo Ref ID</span>
                <span class="label-opt">Optional</span>
              </label>
              <input type="text" id="catchNotesInput" class="input-field" placeholder="e.g. Marshal JM • Mat Photo #042" />
            </div>

            <div class="timestamp-preview">
              <span>Timestamp (auto-captured on submit)</span>
              <span class="mono" id="liveTimestampClock">${formatTime(new Date().toISOString())}</span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="min-height:54px; font-size:16px;">
              Save Verified Catch
            </button>
          </form>
        `;

        openModal(html, sheet => {
          const comboInput = sheet.querySelector('#anglerComboInput');
          const dropdown = sheet.querySelector('#anglerComboDropdown');
          const chipSlot = sheet.querySelector('#selectedAnglerChip');
          const errBox = sheet.querySelector('#catchFormError');
          const lengthInput = sheet.querySelector('#catchLengthInput');
          const weightInput = sheet.querySelector('#catchWeightInput');
          const speciesInput = sheet.querySelector('#catchSpeciesInput');
          const notesInput = sheet.querySelector('#catchNotesInput');

          function renderSelectedChip() {
            if (!selectedAngler) {
              chipSlot.innerHTML = '';
              return;
            }
            const divSuffix = selectedAngler.division ? ` · ${escapeHtml(selectedAngler.division)}` : '';
            chipSlot.innerHTML = `
              <div class="selected-angler-pill">
                <span>Selected: ${escapeHtml(selectedAngler.name)} (#${escapeHtml(selectedAngler.badge)}${divSuffix})</span>
                <button type="button" id="clearSelectedAngler" style="background:none;border:none;color:#003B5C;font-weight:900;cursor:pointer;padding:2px 6px;">Change</button>
              </div>
            `;
            chipSlot.querySelector('#clearSelectedAngler').addEventListener('click', () => {
              selectedAngler = null;
              comboInput.value = '';
              renderSelectedChip();
              comboInput.focus();
              renderDropdown('');
              dropdown.classList.add('open');
            });
          }

          function renderDropdown(filterText) {
            const q = filterText.trim().toLowerCase();
            const matches = ds.anglers.filter(a => {
              if (!q) return true;
              return (
                a.name.toLowerCase().includes(q) ||
                a.badge.toLowerCase().includes(q) ||
                (a.division || '').toLowerCase().includes(q)
              );
            });

            let out = matches.map(a => `
              <button type="button" class="combo-option ${selectedAngler && selectedAngler.id === a.id ? 'selected' : ''}" data-pick-angler="${a.id}">
                <span>${escapeHtml(a.name)}</span>
                <span class="badge-tag mono">#${escapeHtml(a.badge)}${a.division ? ' · ' + escapeHtml(a.division) : ''}</span>
              </button>
            `).join('');

            if (matches.length === 0) {
              out += `<div style="padding:12px; font-size:13px; color:#3F667C; font-weight:600;">No registered anglers match "${escapeHtml(filterText)}".</div>`;
            }

            out += `<button type="button" class="combo-option combo-add-new" data-quick-register="true">+ Register New Angler</button>`;
            dropdown.innerHTML = out;

            dropdown.querySelectorAll('[data-pick-angler]').forEach(opt => {
              opt.addEventListener('mousedown', e => {
                e.preventDefault();
                selectedAngler = ds.anglers.find(a => a.id === opt.dataset.pickAngler) || null;
                if (selectedAngler) {
                  comboInput.value = `${selectedAngler.name} (#${selectedAngler.badge})`;
                  renderSelectedChip();
                }
                dropdown.classList.remove('open');
                lengthInput.focus();
              });
            });

            const quickReg = dropdown.querySelector('[data-quick-register]');
            if (quickReg) {
              quickReg.addEventListener('mousedown', e => {
                e.preventDefault();
                openAnglerFormModal(null, newAngler => {
                  openLogCatchModal(newAngler.id);
                });
              });
            }
          }

          renderSelectedChip();

          comboInput.addEventListener('focus', () => {
            renderDropdown(selectedAngler ? '' : comboInput.value);
            dropdown.classList.add('open');
          });

          comboInput.addEventListener('input', () => {
            selectedAngler = null;
            renderSelectedChip();
            renderDropdown(comboInput.value);
            dropdown.classList.add('open');
          });

          comboInput.addEventListener('blur', () => {
            setTimeout(() => dropdown.classList.remove('open'), 150);
          });

          sheet.querySelectorAll('[data-species]').forEach(chip => {
            chip.addEventListener('click', () => {
              speciesInput.value = chip.dataset.species;
              sheet.querySelectorAll('[data-species]').forEach(c => c.classList.remove('selected'));
              chip.classList.add('selected');
            });
          });

          uiState.liveClockTimer = setInterval(() => {
            const clockEl = document.getElementById('liveTimestampClock');
            if (clockEl) clockEl.textContent = formatTime(new Date().toISOString());
          }, 1000);

          if (selectedAngler) {
            setTimeout(() => lengthInput.focus(), 60);
          }

          sheet.querySelector('#logCatchForm').addEventListener('submit', e => {
            e.preventDefault();
            errBox.classList.remove('visible');

            if (!selectedAngler) {
              errBox.textContent = 'Please select a registered angler from the dropdown.';
              errBox.classList.add('visible');
              comboInput.focus();
              return;
            }

            const lengthVal = parseFloat(lengthInput.value);
            const weightVal = parseFloat(weightInput.value);

            if (!Number.isFinite(lengthVal) || lengthVal <= 0) {
              errBox.textContent = 'Enter a valid positive length in cm (decimals supported).';
              errBox.classList.add('visible');
              lengthInput.focus();
              return;
            }

            if (!Number.isFinite(weightVal) || weightVal <= 0) {
              errBox.textContent = 'Enter a valid positive weight in kg (decimals supported).';
              errBox.classList.add('visible');
              weightInput.focus();
              return;
            }

            const newCatch = {
              id: generateId('c'),
              seq: ds.nextSeq++,
              anglerId: selectedAngler.id,
              species: speciesInput.value.trim(),
              lengthCm: roundTo(lengthVal, 2),
              weightKg: roundTo(weightVal, 3),
              timestamp: new Date().toISOString(),
              notes: notesInput.value.trim(),
              status: 'active',
              auditTrail: []
            };

            ds.catches.push(newCatch);
            saveStore();
            closeModal();
            renderApp();
            showToast(`Logged ${formatLogId(newCatch.seq)} for ${selectedAngler.name} (${formatLength(newCatch.lengthCm)} cm / ${formatWeight(newCatch.weightKg)} kg)`);
          });
        });
      }

      /* =========================================================
         MODAL: REGISTER / EDIT ANGLER
      ========================================================= */
      function suggestNextBadge(ds) {
        let maxNum = 100;
        ds.anglers.forEach(a => {
          const m = String(a.badge).match(/\d+/);
          if (m) {
            const n = parseInt(m[0], 10);
            if (n > maxNum) maxNum = n;
          }
        });
        return String(maxNum + 1);
      }

      function openAnglerFormModal(editAnglerId, onCreatedCallback) {
        const ds = getDataset();
        const existing = editAnglerId ? ds.anglers.find(a => a.id === editAnglerId) : null;
        const defaultBadge = existing ? existing.badge : suggestNextBadge(ds);
        const currentDiv = existing ? (existing.division || '') : '';

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">${existing ? 'Edit Angler' : 'Register Angler'}</h2>
              <div class="sheet-subtitle">${existing ? 'Update competitor badge or optional division' : 'Quick competitor check-in'}</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <form id="anglerForm" class="sheet-body" novalidate>
            <div id="anglerFormError" class="error-msg"></div>

            <div class="form-group">
              <label class="form-label" for="anglerNameInput">
                <span>Angler Full Name <span class="label-req">*</span></span>
              </label>
              <input type="text" id="anglerNameInput" class="input-field" placeholder="e.g. Jordan Reid" value="${existing ? escapeHtml(existing.name) : ''}" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="anglerBadgeInput">
                <span>Angler ID / Badge Number <span class="label-req">*</span></span>
                <span class="label-opt">Unique ID</span>
              </label>
              <input type="text" id="anglerBadgeInput" class="input-field mono" placeholder="e.g. 109" value="${escapeHtml(defaultBadge)}" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="anglerDivisionInput">
                <span>Category / Division</span>
                <span class="label-opt">Optional</span>
              </label>
              <input type="text" id="anglerDivisionInput" class="input-field" value="${escapeHtml(currentDiv)}" placeholder="Leave blank for undivided comp, or pick below..." />
              <div class="preset-chips">
                ${DEFAULT_DIVISIONS.map(d => `<button type="button" class="preset-chip ${d === currentDiv ? 'selected' : ''}" data-pick-div="${escapeHtml(d)}">${escapeHtml(d)}</button>`).join('')}
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="min-height:52px; font-size:15.5px;">
              ${existing ? 'Save Angler Changes' : 'Register Angler'}
            </button>
          </form>
        `;

        openModal(html, sheet => {
          const nameInput = sheet.querySelector('#anglerNameInput');
          const badgeInput = sheet.querySelector('#anglerBadgeInput');
          const divInput = sheet.querySelector('#anglerDivisionInput');
          const errBox = sheet.querySelector('#anglerFormError');

          setTimeout(() => nameInput.focus(), 60);

          sheet.querySelectorAll('[data-pick-div]').forEach(chip => {
            chip.addEventListener('click', () => {
              const wasSelected = chip.classList.contains('selected');
              sheet.querySelectorAll('[data-pick-div]').forEach(c => c.classList.remove('selected'));
              if (wasSelected) {
                divInput.value = '';
              } else {
                divInput.value = chip.dataset.pickDiv;
                chip.classList.add('selected');
              }
            });
          });

          divInput.addEventListener('input', () => {
            const val = divInput.value.trim();
            sheet.querySelectorAll('[data-pick-div]').forEach(c => {
              c.classList.toggle('selected', c.dataset.pickDiv === val);
            });
          });

          sheet.querySelector('#anglerForm').addEventListener('submit', e => {
            e.preventDefault();
            errBox.classList.remove('visible');

            const name = nameInput.value.trim();
            const badge = badgeInput.value.trim().replace(/^#/, '');
            const division = divInput.value.trim();

            if (!name) {
              errBox.textContent = 'Please enter the angler name.';
              errBox.classList.add('visible');
              nameInput.focus();
              return;
            }
            if (!badge) {
              errBox.textContent = 'Please enter a badge or ID number.';
              errBox.classList.add('visible');
              badgeInput.focus();
              return;
            }

            const duplicate = ds.anglers.find(
              a => a.badge.toLowerCase() === badge.toLowerCase() && (!existing || a.id !== existing.id)
            );
            if (duplicate) {
              errBox.textContent = `Badge #${badge} is already assigned to ${duplicate.name}.`;
              errBox.classList.add('visible');
              badgeInput.focus();
              return;
            }

            if (existing) {
              existing.name = name;
              existing.badge = badge;
              existing.division = division;
              saveStore();
              closeModal();
              renderApp();
              showToast(`Updated ${name} (#${badge})`);
            } else {
              const created = {
                id: generateId('ang'),
                name,
                badge,
                division,
                createdAt: new Date().toISOString()
              };
              ds.anglers.push(created);
              saveStore();
              closeModal();
              renderApp();
              showToast(`Registered ${name} (#${badge}${division ? ' · ' + division : ''})`);
              if (onCreatedCallback) onCreatedCallback(created);
            }
          });
        });
      }

      /* =========================================================
         MODAL: EDIT CATCH (WITH MANDATORY AUDIT REASON)
      ========================================================= */
      function openEditCatchModal(catchId) {
        const ds = getDataset();
        const entry = ds.catches.find(c => c.id === catchId);
        if (!entry || entry.status === 'voided') return;

        const anglerOptions = ds.anglers.map(a => `
          <option value="${a.id}" ${a.id === entry.anglerId ? 'selected' : ''}>
            ${escapeHtml(a.name)} (#${escapeHtml(a.badge)}${a.division ? ' · ' + escapeHtml(a.division) : ''})
          </option>
        `).join('');

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">Edit ${escapeHtml(formatLogId(entry.seq))}</h2>
              <div class="sheet-subtitle">Audit-protected change — reason required</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <form id="editCatchForm" class="sheet-body" novalidate>
            <div id="editCatchError" class="error-msg"></div>

            <div class="form-group">
              <label class="form-label" for="editAnglerSelect"><span>Angler <span class="label-req">*</span></span></label>
              <select id="editAnglerSelect" class="input-field">${anglerOptions}</select>
            </div>

            <div class="two-col">
              <div class="form-group">
                <label class="form-label" for="editLengthInput"><span>Length (cm) <span class="label-req">*</span></span></label>
                <input type="number" id="editLengthInput" class="input-field big-num-input" inputmode="decimal" step="0.1" min="0.1" value="${entry.lengthCm}" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="editWeightInput"><span>Weight (kg) <span class="label-req">*</span></span></label>
                <input type="number" id="editWeightInput" class="input-field big-num-input" inputmode="decimal" step="0.01" min="0.01" value="${entry.weightKg}" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="editSpeciesInput"><span>Species</span></label>
              <input type="text" id="editSpeciesInput" class="input-field" value="${escapeHtml(entry.species || '')}" />
            </div>

            <div class="form-group">
              <label class="form-label" for="editNotesInput"><span>Verification Notes / Photo Ref</span></label>
              <input type="text" id="editNotesInput" class="input-field" value="${escapeHtml(entry.notes || '')}" />
            </div>

            <div class="form-group" style="background:#FEF3C7; border:1.5px solid #F59E0B; border-radius:12px; padding:12px;">
              <label class="form-label" for="editReasonInput" style="color:#78350F;">
                <span>Reason for Edit <span class="label-req">*</span></span>
                <span class="label-opt" style="color:#92400E;">Logged in audit trail</span>
              </label>
              <input type="text" id="editReasonInput" class="input-field" placeholder="Explain why this entry is being corrected..." required />
              <div class="preset-chips">
                ${EDIT_REASONS.map(r => `<button type="button" class="preset-chip" data-edit-reason="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('')}
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="min-height:52px;">
              Save Corrected Entry
            </button>
          </form>
        `;

        openModal(html, sheet => {
          const reasonInput = sheet.querySelector('#editReasonInput');
          const errBox = sheet.querySelector('#editCatchError');

          sheet.querySelectorAll('[data-edit-reason]').forEach(chip => {
            chip.addEventListener('click', () => {
              reasonInput.value = chip.dataset.editReason;
            });
          });

          sheet.querySelector('#editCatchForm').addEventListener('submit', e => {
            e.preventDefault();
            errBox.classList.remove('visible');

            const newAnglerId = sheet.querySelector('#editAnglerSelect').value;
            const newLen = parseFloat(sheet.querySelector('#editLengthInput').value);
            const newWt = parseFloat(sheet.querySelector('#editWeightInput').value);
            const newSpecies = sheet.querySelector('#editSpeciesInput').value.trim();
            const newNotes = sheet.querySelector('#editNotesInput').value.trim();
            const reason = reasonInput.value.trim();

            if (!Number.isFinite(newLen) || newLen <= 0 || !Number.isFinite(newWt) || newWt <= 0) {
              errBox.textContent = 'Length and Weight must both be valid positive numbers.';
              errBox.classList.add('visible');
              return;
            }
            if (reason.length < 3) {
              errBox.textContent = 'A brief Reason for Edit (at least 3 characters) is required for integrity logging.';
              errBox.classList.add('visible');
              reasonInput.focus();
              return;
            }

            if (!entry.auditTrail) entry.auditTrail = [];
            entry.auditTrail.push({
              action: 'edited',
              timestamp: new Date().toISOString(),
              reason,
              previous: {
                anglerId: entry.anglerId,
                species: entry.species,
                lengthCm: entry.lengthCm,
                weightKg: entry.weightKg,
                notes: entry.notes
              }
            });

            entry.anglerId = newAnglerId;
            entry.lengthCm = roundTo(newLen, 2);
            entry.weightKg = roundTo(newWt, 3);
            entry.species = newSpecies;
            entry.notes = newNotes;

            saveStore();
            closeModal();
            renderApp();
            showToast(`Updated ${formatLogId(entry.seq)} & recorded audit reason`);
          });
        });
      }

         MODAL: VOID CATCH (WITH MANDATORY AUDIT REASON)

        const html = `

              <div class="tabular" style="margin-top:4px; color:#1D445B;">

            </div>

            <div class="form-group">
              <label class="form-label" for="voidReasonInput">
                <span>Reason for Voiding <span class="label-req">*</span></span>

              <input type="text" id="voidReasonInput" class="input-field" placeholder="State marshal reason for voiding this catch..." required />
              <div class="preset-chips">

              <button type="submit" class="btn btn-danger" style="flex:1.4; min-height:52px;">Confirm Void Entry</button>
            </div>
          </form>
        `;

        openModal(html, sheet => {
          const reasonInput = sheet.querySelector('#voidReasonInput');
          const errBox = sheet.querySelector('#voidCatchError');
          setTimeout(() => reasonInput.focus(), 60);

          sheet.querySelectorAll('[data-void-reason]').forEach(chip => {
            chip.addEventListener('click', () => {
              reasonInput.value = chip.dataset.voidReason;
            });
          });

          sheet.querySelector('#voidCatchForm').addEventListener('submit', e => {
            e.preventDefault();
            errBox.classList.remove('visible');

            const reason = reasonInput.value.trim();
            if (reason.length < 3) {
              errBox.textContent = 'Please provide a brief Reason for Void (at least 3 characters).';
              errBox.classList.add('visible');
              reasonInput.focus();
              return;
            }

            const nowIso = new Date().toISOString();
            entry.status = 'voided';
            entry.voidReason = reason;
            entry.voidedAt = nowIso;
            if (!entry.auditTrail) entry.auditTrail = [];
            entry.auditTrail.push({
              action: 'voided',
              timestamp: nowIso,
              reason
            });

            saveStore();
            closeModal();
            renderApp();
            showToast(`Voided ${formatLogId(entry.seq)} — excluded from standings`);
          });
        });
      }

      /* =========================================================
         CSV EXPORT & PRINT SUMMARY
      ========================================================= */
      function csvCell(val) {
        let s = val == null ? '' : String(val);
        if (/^[=+\-@]/.test(s)) s = "'" + s;
        if (/[",\r\n]/.test(s)) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }

      function generateCsvContent(ds) {
        const computed = computeAllStats(ds, 'ALL');
        const anglerMap = new Map(ds.anglers.map(a => [a.id, a]));
        const lines = [];

        lines.push(['TOURNAMENT SUMMARY', ds.competitionName, 'Exported At', new Date().toISOString()].map(csvCell).join(','));
        lines.push('');
        lines.push(['Category', 'Place', 'Angler Name', 'Badge #', 'Division', 'Result', 'Unit', 'Tie-Breaker Applied', 'Tie-Breaker Detail'].map(csvCell).join(','));

        CATEGORIES.forEach(cat => {
          const lb = computed.leaderboards[cat.id];
          lb.entries.forEach(e => {
            lines.push([
              cat.title,
              e.rank,
              e.angler.name,
              e.angler.badge,
              e.angler.division || '',
              e.primaryDisplay,
              e.unit,
              e.tieBreakerApplied ? 'YES' : 'NO',
              e.tieBreakerReason || ''
            ].map(csvCell).join(','));
          });
        });

        lines.push('');
        lines.push(['RAW CATCH AUDIT LEDGER'].map(csvCell).join(','));
        lines.push(['Log ID', 'Status', 'Timestamp (ISO)', 'Angler Name', 'Badge #', 'Division', 'Species', 'Length (cm)', 'Weight (kg)', 'Verification Notes', 'Audit Trail (Edits/Void Reasons)'].map(csvCell).join(','));

        const chronological = [...ds.catches].sort((a, b) => a.seq - b.seq);
        chronological.forEach(c => {
          const ang = anglerMap.get(c.anglerId);
          const trailSummary = (c.auditTrail || []).map(t => `${t.action.toUpperCase()}@${t.timestamp}: ${t.reason}`).join(' | ');
          lines.push([
            formatLogId(c.seq),
            c.status === 'voided' ? 'VOIDED' : 'ACTIVE',
            c.timestamp,
            ang ? ang.name : 'Unknown',
            ang ? ang.badge : '',
            ang ? (ang.division || '') : '',
            c.species || '',
            formatLength(c.lengthCm),
            formatWeight(c.weightKg),
            c.notes || '',
            trailSummary
          ].map(csvCell).join(','));
        });

        return lines.join('\r\n');
      }

      function exportCsvBackup() {
        const ds = getDataset();
        const csv = generateCsvContent(ds);
        const safeName = (ds.competitionName || 'fishing_comp').toLowerCase().replace(/[^a-z0-9]+/g, '_');
        const filename = `${safeName}_audit_standings.csv`;

        try {
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(`Exported ${filename}`);
        } catch (err) {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(csv);
            showToast('CSV copied to clipboard');
          }
        }
      }

      function buildPrintReportHtml(ds) {
        const computed = computeAllStats(ds, 'ALL');
        const anglerMap = new Map(ds.anglers.map(a => [a.id, a]));
        const activeCount = ds.catches.filter(c => c.status !== 'voided').length;
        const voidCount = ds.catches.length - activeCount;

        const podiumRows = CATEGORIES.map(cat => {
          const lb = computed.leaderboards[cat.id];
          const p1 = lb.entries[0];
          const p2 = lb.entries[1];
          return `
            <tr>
              <td><strong>${escapeHtml(cat.title)}</strong></td>
              <td>${p1 ? `${escapeHtml(p1.angler.name)} (#${escapeHtml(p1.angler.badge)}) — <strong>${escapeHtml(p1.primaryDisplay)} ${escapeHtml(p1.unit)}</strong>${p1.tieBreakerApplied ? ` [${escapeHtml(p1.tieBreakerReason)}]` : ''}` : '—'}</td>
              <td>${p2 ? `${escapeHtml(p2.angler.name)} (#${escapeHtml(p2.angler.badge)}) — <strong>${escapeHtml(p2.primaryDisplay)} ${escapeHtml(p2.unit)}</strong>${p2.tieBreakerApplied ? ` [${escapeHtml(p2.tieBreakerReason)}]` : ''}` : '—'}</td>
            </tr>
          `;
        }).join('');

        const auditRows = [...ds.catches]
          .sort((a, b) => a.seq - b.seq)
          .map(c => {
            const ang = anglerMap.get(c.anglerId);
            const isVoid = c.status === 'voided';
            const auditText = (c.auditTrail || []).map(t => `${t.action.toUpperCase()}: ${t.reason}`).join('; ');
            return `
              <tr class="${isVoid ? 'print-void-row' : ''}">
                <td class="mono">${escapeHtml(formatLogId(c.seq))}</td>
                <td class="tabular">${escapeHtml(formatDateTime(c.timestamp))}</td>
                <td>${escapeHtml(ang ? `${ang.name} (#${ang.badge})` : 'Unknown')}</td>
                <td>${escapeHtml(c.species || '—')}</td>
                <td class="tabular">${formatLength(c.lengthCm)} cm</td>
                <td class="tabular">${formatWeight(c.weightKg)} kg</td>
                <td>${isVoid ? 'VOIDED' : 'ACTIVE'}</td>
                <td>${escapeHtml([c.notes, auditText].filter(Boolean).join(' | ') || '—')}</td>
              </tr>
            `;
          }).join('');

        return `
          <div class="print-doc">
            <h2 style="margin:0 0 4px 0; font-size:18px;">${escapeHtml(ds.competitionName)} — Official Standings &amp; Audit Ledger</h2>
            <div style="font-size:12px; color:#475569; margin-bottom:14px;">
              Generated ${escapeHtml(new Date().toLocaleString())} · ${ds.anglers.length} Anglers · ${activeCount} Active Catches · ${voidCount} Voided
            </div>

            <h3 style="margin:0 0 6px 0; font-size:14px;">Award Category Standings (1st &amp; Runner-Up)</h3>
            <table class="print-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>1st Place Winner</th>
                  <th>2nd Place Runner-Up</th>
                </tr>
              </thead>
              <tbody>${podiumRows}</tbody>
            </table>

            <h3 style="margin:0 0 6px 0; font-size:14px;">Complete Chronological Audit Log</h3>
            <table class="print-table">
              <thead>
                <tr>
                  <th>Log ID</th>
                  <th>Time</th>
                  <th>Angler</th>
                  <th>Species</th>
                  <th>Length</th>
                  <th>Weight</th>
                  <th>Status</th>
                  <th>Marshal Notes &amp; Audit Trail</th>
                </tr>
              </thead>
              <tbody>${auditRows || '<tr><td colspan="8">No catches recorded.</td></tr>'}</tbody>
            </table>
          </div>
        `;
      }

      function openPrintSummaryModal() {
        const ds = getDataset();
        const reportHtml = buildPrintReportHtml(ds);
        document.getElementById('printRoot').innerHTML = reportHtml;

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">Official Standings &amp; Audit Report</h2>
              <div class="sheet-subtitle">Print, save as PDF, or copy CSV backup</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="sheet-body" style="overflow-x:auto;">
            ${reportHtml}
          </div>
          <div class="sheet-footer">
            <button type="button" class="btn btn-secondary" id="copyCsvFromReportBtn">Copy CSV</button>
            <button type="button" class="btn btn-primary" style="flex:1;" id="triggerPrintBtn">Print / Save PDF</button>
          </div>
        `;

        openModal(html, sheet => {
          sheet.querySelector('#triggerPrintBtn').addEventListener('click', () => {
            window.print();
          });
          sheet.querySelector('#copyCsvFromReportBtn').addEventListener('click', () => {
            const csv = generateCsvContent(ds);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(csv).then(() => showToast('Full CSV copied to clipboard'));
            } else {
              exportCsvBackup();
            }
          });
        });
      }

      function buildCleanIndexHtml() {
        const clone = document.documentElement.cloneNode(true);
        const main = clone.querySelector('#mainContent');
        if (main) main.innerHTML = '';
        const modalBackdrop = clone.querySelector('#modalBackdrop');
        if (modalBackdrop) modalBackdrop.classList.remove('open');
        const modalSheet = clone.querySelector('#modalSheet');
        if (modalSheet) modalSheet.innerHTML = '';
        const printRoot = clone.querySelector('#printRoot');
        if (printRoot) printRoot.innerHTML = '';
        const toast = clone.querySelector('#toast');
        if (toast) {
          toast.classList.remove('show');
          toast.textContent = '';
        }
        const sampleBanner = clone.querySelector('#sampleBanner');
        if (sampleBanner) sampleBanner.style.display = 'none';
        const logoImg = clone.querySelector('#headerLogoImg');
        if (logoImg) {
          logoImg.setAttribute('src', store.customLogoDataUrl || DEFAULT_LOGO_DATA_URI);
        }
        const head = clone.querySelector('head');
        if (head && !head.querySelector('link[rel="manifest"]')) {
          const manifestLink = document.createElement('link');
          manifestLink.setAttribute('rel', 'manifest');
          manifestLink.setAttribute('href', './manifest.webmanifest');
          const iconLink = document.createElement('link');
          iconLink.setAttribute('rel', 'icon');
          iconLink.setAttribute('type', 'image/svg+xml');
          iconLink.setAttribute('href', './icon.svg');
          const appleLink = document.createElement('link');
          appleLink.setAttribute('rel', 'apple-touch-icon');
          appleLink.setAttribute('href', './icon.svg');
          const titleEl = head.querySelector('title');
          if (titleEl) {
            head.insertBefore(manifestLink, titleEl);
            head.insertBefore(iconLink, titleEl);
            head.insertBefore(appleLink, titleEl);
          } else {
            head.appendChild(manifestLink);
            head.appendChild(iconLink);
            head.appendChild(appleLink);
          }
        }
        return '<!DOCTYPE html>\n' + clone.outerHTML;
      }

      function crc32Bytes(bytes) {
        let crc = 0xFFFFFFFF;
        for (let i = 0; i < bytes.length; i++) {
          crc ^= bytes[i];
          for (let j = 0; j < 8; j++) {
            crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
          }
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function createZipBytes(fileEntries) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        let offset = 0;

        for (const entry of fileEntries) {
          const nameBytes = encoder.encode(entry.name);
          const dataBytes = encoder.encode(entry.content);
          const crc = crc32Bytes(dataBytes);

          const local = new Uint8Array(30 + nameBytes.length);
          const lv = new DataView(local.buffer);
          lv.setUint32(0, 0x04034b50, true);
          lv.setUint16(4, 20, true);
          lv.setUint16(6, 0x0800, true);
          lv.setUint16(8, 0, true);
          lv.setUint16(10, 0, true);
          lv.setUint16(12, 0, true);
          lv.setUint32(14, crc, true);
          lv.setUint32(18, dataBytes.length, true);
          lv.setUint32(22, dataBytes.length, true);
          lv.setUint16(26, nameBytes.length, true);
          lv.setUint16(28, 0, true);
          local.set(nameBytes, 30);

          const central = new Uint8Array(46 + nameBytes.length);
          const cv = new DataView(central.buffer);
          cv.setUint32(0, 0x02014b50, true);
          cv.setUint16(4, 20, true);
          cv.setUint16(6, 20, true);
          cv.setUint16(8, 0x0800, true);
          cv.setUint16(10, 0, true);
          cv.setUint16(12, 0, true);
          cv.setUint16(14, 0, true);
          cv.setUint32(16, crc, true);
          cv.setUint32(20, dataBytes.length, true);
          cv.setUint32(24, dataBytes.length, true);
          cv.setUint16(28, nameBytes.length, true);
          cv.setUint16(30, 0, true);
          cv.setUint16(32, 0, true);
          cv.setUint16(34, 0, true);
          cv.setUint16(36, 0, true);
          cv.setUint32(38, 0, true);
          cv.setUint32(42, offset, true);
          central.set(nameBytes, 46);

          localParts.push(local, dataBytes);
          centralParts.push(central);
          offset += local.length + dataBytes.length;
        }

        const centralSize = centralParts.reduce((s, p) => s + p.length, 0);
        const eocd = new Uint8Array(22);
        const ev = new DataView(eocd.buffer);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(4, 0, true);
        ev.setUint16(6, 0, true);
        ev.setUint16(8, fileEntries.length, true);
        ev.setUint16(10, fileEntries.length, true);
        ev.setUint32(12, centralSize, true);
        ev.setUint32(16, offset, true);
        ev.setUint16(20, 0, true);

        const totalLength = offset + centralSize + eocd.length;
        const out = new Uint8Array(totalLength);
        let pos = 0;
        for (const p of localParts) { out.set(p, pos); pos += p.length; }
        for (const p of centralParts) { out.set(p, pos); pos += p.length; }
        out.set(eocd, pos);
        return out;
      }

      function triggerBlobDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function downloadPwaZip() {
        const entries = [{ name: 'index.html', content: buildCleanIndexHtml() }];
        Object.keys(PWA_EXTRA_FILES).forEach(k => entries.push({ name: k, content: PWA_EXTRA_FILES[k] }));
        const zipBytes = createZipBytes(entries);
        triggerBlobDownload(new Blob([zipBytes], { type: 'application/zip' }), 'fishing-competition-scorer-pwa.zip');
        showToast('Downloaded fishing-competition-scorer-pwa.zip (6 PWA files)');
      }

      function downloadSingleHtml() {
        const htmlStr = buildCleanIndexHtml();
        triggerBlobDownload(new Blob([htmlStr], { type: 'text/html;charset=utf-8' }), 'index.html');
        showToast('Downloaded index.html');
      }

      function copyIndexHtmlToClipboard() {
        const htmlStr = buildCleanIndexHtml();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(htmlStr)
            .then(() => showToast('Copied full index.html to clipboard! Paste into GitHub as index.html.'))
            .catch(() => openManualCopyModal(htmlStr));
        } else {
          openManualCopyModal(htmlStr);
        }
      }

      function openManualCopyModal(codeStr) {
        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">Copy index.html</h2>
              <div class="sheet-subtitle">Select all and copy, then paste into GitHub as index.html</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <textarea id="manualCopyArea" class="input-field mono" readonly style="min-height:260px; font-size:11.5px; white-space:pre;">${escapeHtml(codeStr)}</textarea>
          </div>
          <div class="sheet-footer">
            <button type="button" class="btn btn-primary btn-block" id="selectAllCopyBtn">Select All &amp; Copy</button>
          </div>
        `;
        openModal(html, sheet => {
          const area = sheet.querySelector('#manualCopyArea');
          sheet.querySelector('#selectAllCopyBtn').addEventListener('click', () => {
            area.focus();
            area.select();
            try {
              document.execCommand('copy');
              showToast('Copied index.html to clipboard');
            } catch (err) {
              showToast('Press Ctrl+C / Cmd+C to copy');
            }
          });
        });
      }

      /* =========================================================
         MODAL: SETTINGS & SAMPLE DATA CONTROLS
      ========================================================= */
      function openSettingsModal() {
        const ds = getDataset();

        const html = `
          <div class="sheet-header">
            <div>
              <h2 class="sheet-title">Competition Settings</h2>
              <div class="sheet-subtitle">${store.sampleMode ? 'Currently editing Sample Mode' : 'Currently editing Live Competition'}</div>
            </div>
            <button type="button" class="close-btn" data-close-modal aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="sheet-body">
            <div class="drawer-rule-box" style="background:#E2F4FC; border-color:#6BC4E8; margin-bottom:14px;">
              <div style="font-weight:800; color:#003B5C; margin-bottom:4px;">Download &amp; Publish App Files</div>
              <div style="margin-bottom:10px; color:#00263E;">
                Save the updated Fishing Competition Scorer PWA bundle directly to your computer to upload to GitHub Pages or Netlify Drop.
              </div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="btn btn-primary btn-block" id="downloadPwaZipBtn">Download Full PWA Bundle (.zip)</button>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                  <button type="button" class="btn btn-secondary btn-sm" id="downloadHtmlBtn">Download index.html</button>
                  <button type="button" class="btn btn-secondary btn-sm" id="copyHtmlBtn">Copy index.html</button>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="compNameInput"><span>Competition Name</span></label>
              <div style="display:flex; gap:8px;">
                <input type="text" id="compNameInput" class="input-field" value="${escapeHtml(ds.competitionName)}" />
                <button type="button" class="btn btn-dark" id="saveCompNameBtn">Save</button>
              </div>
            </div>

            <div class="drawer-rule-box" style="margin-top:12px;">
              <div style="font-weight:800; color:#00263E; margin-bottom:4px;">Header Logo Image</div>
              <div style="margin-bottom:10px;">
                Displays the Fish Trophy logo by default. Optionally upload a custom club logo PNG/SVG to embed offline on this device.
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <label class="btn btn-secondary btn-sm" style="flex:1; cursor:pointer;">
                  Upload Custom Logo
                  <input type="file" id="customLogoFileInput" accept="image/*" style="display:none;" />
                </label>
                ${store.customLogoDataUrl ? '<button type="button" class="btn btn-secondary btn-sm" id="resetLogoBtn">Reset Default</button>' : ''}
              </div>
            </div>

            <div class="drawer-rule-box" style="margin-top:12px;">
              <div style="font-weight:800; color:#00263E; margin-bottom:4px;">Load Sample Competition Data</div>
              <div style="margin-bottom:10px;">
                Test all 5 leaderboards, tie-breaker badges, edit history, and voided entries with realistic tournament data. Your live competition records stay safely preserved.
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" class="btn ${store.sampleMode ? 'btn-secondary' : 'btn-primary'}" id="modalToggleSampleBtn" style="flex:1;">
                  ${store.sampleMode ? 'Switch Back to Live Data' : 'Load Sample Competition Data'}
                </button>
                ${store.sampleMode ? '<button type="button" class="btn btn-secondary" id="resetSampleBtn">Reset Sample</button>' : ''}
              </div>
            </div>

            <div class="drawer-rule-box" style="margin-top:12px;">
              <div style="font-weight:800; color:#00263E; margin-bottom:4px;">Offline Storage &amp; Backup</div>
              <div style="margin-bottom:10px;">
                All anglers, catches, and audit trails are saved automatically to device storage (<span class="mono">localStorage</span>) for zero-reception reliability on the water.
              </div>
              <button type="button" class="btn btn-secondary btn-block" id="settingsExportCsvBtn">Download Full CSV Backup</button>
            </div>

            ${!store.sampleMode ? `
              <div class="drawer-rule-box" style="margin-top:12px; background:#FFF5F5; border-color:#FCA5A5;">
                <div style="font-weight:800; color:#991B1B; margin-bottom:4px;">Reset Live Competition</div>
                <div style="margin-bottom:10px; color:#7F1D1D;">
                  Permanently clear all live anglers and catch logs to start a brand-new tournament. Export CSV first!
                </div>
                <button type="button" class="btn btn-danger-outline btn-block" id="clearLiveDataBtn">Clear All Live Data</button>
              </div>
            ` : ''}
          </div>
        `;

        openModal(html, sheet => {
          sheet.querySelector('#downloadPwaZipBtn').addEventListener('click', downloadPwaZip);
          sheet.querySelector('#downloadHtmlBtn').addEventListener('click', downloadSingleHtml);
          sheet.querySelector('#copyHtmlBtn').addEventListener('click', copyIndexHtmlToClipboard);

          sheet.querySelector('#saveCompNameBtn').addEventListener('click', () => {
            const val = sheet.querySelector('#compNameInput').value.trim();
            if (val) {
              ds.competitionName = val;
              saveStore();
              renderApp();
              showToast('Competition name updated');
            }
          });

          const logoInput = sheet.querySelector('#customLogoFileInput');
          if (logoInput) {
            logoInput.addEventListener('change', e => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                store.customLogoDataUrl = String(reader.result || '');
                saveStore();
                applyHeaderLogo();
                closeModal();
                showToast('Custom header logo saved offline');
              };
              reader.readAsDataURL(file);
            });
          }

          const resetLogo = sheet.querySelector('#resetLogoBtn');
          if (resetLogo) {
            resetLogo.addEventListener('click', () => {
              store.customLogoDataUrl = '';
              saveStore();
              applyHeaderLogo();
              closeModal();
              showToast('Restored default Fish Trophy logo');
            });
          }

          sheet.querySelector('#modalToggleSampleBtn').addEventListener('click', () => {
            toggleSampleMode();
            closeModal();
          });

          const resetSample = sheet.querySelector('#resetSampleBtn');
          if (resetSample) {
            resetSample.addEventListener('click', () => {
              store.sampleData = buildSampleDataset();
              saveStore();
              closeModal();
              renderApp();
              showToast('Sample competition reset to original dataset');
            });
          }

          sheet.querySelector('#settingsExportCsvBtn').addEventListener('click', exportCsvBackup);

          const clearBtn = sheet.querySelector('#clearLiveDataBtn');
          if (clearBtn) {
            let confirmArmed = false;
            clearBtn.addEventListener('click', () => {
              if (!confirmArmed) {
                confirmArmed = true;
                clearBtn.textContent = 'Tap Again to Confirm Clear Live Data';
                clearBtn.classList.remove('btn-danger-outline');
                clearBtn.classList.add('btn-danger');
                return;
              }
              store.liveData = createEmptyDataset();
              saveStore();
              closeModal();
              renderApp();
              showToast('Live competition cleared');
            });
          }
        });
      }

      function toggleSampleMode() {
        store.sampleMode = !store.sampleMode;
        uiState.divisionFilter = 'ALL';
        saveStore();
        renderApp();
        showToast(store.sampleMode
          ? 'Sample Competition Loaded (8 anglers, 22 entries, tie-breakers active)'
          : 'Returned to Live Competition Data');
      }

      /* =========================================================
         INITIALIZATION & GLOBAL EVENT LISTENERS
      ========================================================= */
      function init() {
        loadStore();
        applyHeaderLogo();

        document.querySelectorAll('.nav-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            uiState.activeTab = btn.dataset.tab;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });

        document.getElementById('fabLogCatch').addEventListener('click', () => openLogCatchModal(null));
        document.getElementById('exitSampleBtn').addEventListener('click', toggleSampleMode);
        document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);

        document.getElementById('modalBackdrop').addEventListener('click', e => {
          if (e.target.id === 'modalBackdrop') closeModal();
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && document.getElementById('modalBackdrop').classList.contains('open')) {
            closeModal();
          }
        });

        renderApp();

        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
          });
        }
      }

      init();
    })();
  </script>


</body></html>
