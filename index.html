<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#003B5C">
  <meta name="description" content="Mobile-first fishing competition scorer with automated 5-category leaderboards, tie-breaker resolution, and transparent marshal audit log.">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>Fishing Competition Scorer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #DCE9F0;
      color: #00263E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .app-theme {
      --bg-canvas: #EEF5F8;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F4F9FB;
      --bg-muted: #DCE8EF;
      --ink-primary: #00263E;
      --ink-secondary: #1D445B;
      --ink-muted: #3F667C;
      --border-strong: #B4CDDC;
      --border-soft: #DAE7EE;
      --brand: #0082BA;
      --brand-hover: #006996;
      --brand-deep: #003B5C;
      --brand-tint: #E2F4FC;
      --oz-green: #78BE20;
      --oz-green-dark: #2F6309;
      --oz-green-tint: #ECF7DD;
      --oz-green-border: #A8DC66;
      --gold-bg: #FFFBEB;
      --gold-border: #E59400;
      --gold-badge: #C47800;
      --gold-ink: #6B3E00;
      --silver-bg: #F4F9FB;
      --silver-border: #7A9EB3;
      --silver-badge: #365C73;
      --silver-ink: #00263E;
      --tb-bg: #E2F4FC;
      --tb-ink: #005A84;
      --tb-border: #6BC4E8;
      --danger-bg: #FEF2F2;
      --danger-ink: #991B1B;
      --danger-border: #FCA5A5;
      --danger-solid: #C81E1E;
      --warn-bg: #FEF6DB;
      --warn-ink: #7A4A00;
      --warn-border: #F2C14E;
      --ok-bg: #ECF7DD;
      --ok-ink: #2F6309;
      --shadow-sm: 0 1px 2px rgba(0, 43, 73, 0.07);
      --shadow-md: 0 6px 20px rgba(0, 43, 73, 0.13);
      --shadow-fab: 0 8px 24px rgba(0, 130, 186, 0.38);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #DCE9F0;
    }

    .mobile-shell {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0, 59, 92, 0.1), 0 12px 40px rgba(0, 59, 92, 0.1);
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Header — OzFish Deep Ocean Navy with Habitat Green accent stripe */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #003B5C;
      color: #FFFFFF;
      padding: 10px 14px;
      border-bottom: 3px solid #78BE20;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .brand-logo-wrap {
      width: 44px;
      height: 44px;
      padding: 3px;
      border-radius: 11px;
      background: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0, 20, 36, 0.25);
      overflow: hidden;
    }

    .brand-logo-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }

    .brand-text {
      min-width: 0;
    }

    .app-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-subtitle {
      font-size: 12px;
      color: #CBE7F5;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #78BE20;
      display: inline-block;
      flex-shrink: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      border: 1.5px solid #2A6485;
      background: #004E78;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: #006194;
      border-color: #78BE20;
    }

    /* Sample Banner */
    .sample-banner {
      background: #ECF7DD;
      color: #2F6309;
      border-bottom: 1.5px solid #78BE20;
      padding: 8px 16px;
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sample-banner button {
      background: #003B5C;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      min-height: 32px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 14px 14px 108px 14px;
    }

    /* Division Filter Bar */
    .filter-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-strip::-webkit-scrollbar { display: none; }

    .chip-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.12s ease;
    }

    .chip-btn.active {
      background: #003B5C;
      border-color: #003B5C;
      color: #FFFFFF;
    }

    /* Podium Cards */
    .podium-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .podium-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      text-align: left;
      width: 100%;
      padding: 0;
      color: inherit;
      font: inherit;
    }

    .podium-card:hover {
      border-color: #0082BA;
      box-shadow: var(--shadow-md);
    }

    .podium-card:active {
      transform: scale(0.992);
    }

    .podium-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg-subtle);
      gap: 8px;
    }

    .podium-cat-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-primary);
      letter-spacing: -0.01em;
    }

    .cat-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--brand-tint);
      color: var(--brand-deep);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .podium-expand-hint {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .podium-rows {
      display: flex;
      flex-direction: column;
    }

    .podium-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      min-height: 62px;
    }

    .podium-row + .podium-row {
      border-top: 1px solid var(--border-soft);
    }

    .podium-row.place-1 {
      background: var(--gold-bg);
    }

    .podium-row.place-2 {
      background: var(--bg-surface);
    }

    .podium-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .rank-badge {
      min-width: 42px;
      height: 30px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rank-1 {
      background: var(--gold-badge);
      color: #FFFFFF;
    }

    .rank-2 {
      background: var(--silver-badge);
      color: #FFFFFF;
    }

    .rank-other {
      background: var(--bg-muted);
      color: var(--ink-primary);
    }

    .podium-angler-info {
      min-width: 0;
      flex: 1;
    }

    .podium-name-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .podium-angler-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-primary);
      line-height: 1.25;
    }

    .badge-tag {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      background: rgba(15, 23, 42, 0.07);
      padding: 1px 6px;
      border-radius: 5px;
    }

    .podium-meta {
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 600;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tb-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 800;
      color: var(--tb-ink);
      background: var(--tb-bg);
      border: 1px solid var(--tb-border);
      padding: 1px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .podium-score {
      text-align: right;
      flex-shrink: 0;
    }

    .score-value {
      font-size: 20px;
      font-weight: 900;
      color: var(--ink-primary);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .score-unit {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-left: 2px;
    }

    .empty-slot {
      padding: 14px;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Section Toolbars */
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      pointer-events: none;
    }

    .input-field {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.18);
    }

    .search-input {
      padding-left: 38px;
    }

    .btn {
      min-height: 46px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid transparent;
      font-size: 14px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      transition: background 0.12s ease, transform 0.1s ease, border-color 0.12s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--brand);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: var(--brand-hover);
    }

    .btn-dark {
      background: #003B5C;
      color: #FFFFFF;
    }
    .btn-dark:hover {
      background: #004E78;
    }

    .btn-secondary {
      background: var(--bg-surface);
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }
    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: #0082BA;
    }

    .btn-danger {
      background: var(--danger-solid);
      color: #FFFFFF;
    }
    .btn-danger:hover {
      background: #B91C1C;
    }

    .btn-danger-outline {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-ink);
    }

    .btn-sm {
      min-height: 44px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-block {
      width: 100%;
    }

    /* Angler Cards */
    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .angler-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 13px 14px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .angler-card:hover {
      border-color: #0082BA;
      box-shadow: var(--shadow-md);
    }

    .angler-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .angler-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-primary);
    }

    .div-pill {
      display: inline-flex;
      align-items: center;
      font-size: 11.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: #E2F0F7;
      color: #003B5C;
    }

    .div-pill.junior {
      background: #ECF7DD;
      color: #2F6309;
    }

    .podium-count-pill {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--gold-bg);
      border: 1px solid var(--gold-border);
      color: var(--gold-ink);
      white-space: nowrap;
    }

    .angler-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .stat-cell-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
    }

    .stat-cell-val {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-primary);
      margin-top: 1px;
    }

    /* Audit Log Cards */
    .export-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .audit-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 13px 14px;
      box-shadow: var(--shadow-sm);
    }

    .audit-card.voided {
      background: #FFF5F5;
      border-color: var(--danger-border);
    }

    .audit-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .audit-id-time {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .log-id {
      background: #003B5C;
      color: #FFFFFF;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 800;
    }

    .audit-card.voided .log-id {
      background: #991B1B;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .status-active {
      background: var(--ok-bg);
      color: var(--ok-ink);
      border: 1px solid var(--oz-green-border);
    }

    .status-edited {
      background: var(--warn-bg);
      color: var(--warn-ink);
      border: 1px solid var(--warn-border);
    }

    .status-voided {
      background: var(--danger-bg);
      color: var(--danger-ink);
      border: 1px solid var(--danger-border);
    }

    .audit-body.struck {
      text-decoration: line-through;
      opacity: 0.72;
    }

    .audit-angler-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .audit-angler-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 15.5px;
      font-weight: 800;
      color: var(--ink-primary);
      cursor: pointer;
      text-align: left;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .audit-angler-btn:hover {
      color: var(--brand);
    }

    .audit-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .audit-note {
      font-size: 12.5px;
      color: var(--ink-secondary);
      font-weight: 600;
      background: var(--bg-subtle);
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 8px;
      border-left: 3px solid #0082BA;
    }

    .audit-trail-box {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 12px;
      background: #FEF3C7;
      border: 1px solid #FCD34D;
      color: #78350F;
    }

    .audit-trail-box.void-box {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #7F1D1D;
    }

    .audit-trail-item + .audit-trail-item {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(120, 53, 15, 0.25);
    }

    .audit-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .audit-actions .btn {
      flex: 1;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: #FFFFFF;
      border-top: 1.5px solid var(--border-strong);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)) 8px;
      z-index: 40;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.08);
    }

    .nav-tab {
      min-height: 54px;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .nav-tab.active {
      background: var(--brand-tint);
      color: var(--brand-deep);
    }

    /* Floating Action Button */
    .fab-wrap {
      position: fixed;
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      padding: 0 16px;
      z-index: 45;
    }

    .fab-btn {
      pointer-events: auto;
      min-width: 60px;
      height: 60px;
      padding: 0 20px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      background: var(--brand);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      box-shadow: var(--shadow-fab);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .fab-btn:hover {
      background: var(--brand-hover);
      transform: translateY(-2px);
    }

    .fab-btn:active {
      transform: scale(0.95);
    }

    /* Modals & Drawers */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      background: var(--bg-surface);
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 40px rgba(15, 23, 42, 0.28);
      animation: slideUp 0.18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    .sheet-header {
      padding: 14px 16px;
      border-bottom: 1.5px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-subtle);
      flex-shrink: 0;
    }

    .sheet-title {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
      color: var(--ink-primary);
      letter-spacing: -0.015em;
    }

    .sheet-subtitle {
      font-size: 12.5px;
      color: var(--ink-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .close-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sheet-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .sheet-footer {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) 16px;
      border-top: 1.5px solid var(--border-soft);
      background: var(--bg-subtle);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-primary);
      margin-bottom: 6px;
    }

    .label-req {
      color: #B91C1C;
      margin-left: 2px;
    }

    .label-opt {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .big-num-input {
      font-size: 20px;
      font-weight: 800;
      min-height: 52px;
      font-variant-numeric: tabular-nums;
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .preset-chip {
      min-height: 36px;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--ink-secondary);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .preset-chip:hover, .preset-chip.selected {
      background: var(--brand-tint);
      border-color: var(--brand);
      color: var(--brand-deep);
    }

    /* Searchable Combobox */
    .combo-wrap {
      position: relative;
    }

    .combo-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 230px;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 2px solid #003B5C;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      z-index: 80;
      display: none;
    }

    .combo-dropdown.open {
      display: block;
    }

    .combo-option {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: none;
      border-bottom: 1px solid var(--border-soft);
      background: transparent;
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .combo-option:last-child {
      border-bottom: none;
    }

    .combo-option:hover, .combo-option.selected {
      background: var(--brand-tint);
    }

    .combo-add-new {
      color: var(--brand-deep);
      background: var(--bg-subtle);
      font-weight: 800;
    }

    .selected-angler-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin-top: 6px;
      border-radius: 10px;
      background: var(--brand-tint);
      border: 1.5px solid #6BC4E8;
      color: var(--brand-deep);
      font-size: 13px;
      font-weight: 800;
    }

    .timestamp-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      margin-bottom: 14px;
    }

    .error-msg {
      background: var(--danger-bg);
      border: 1.5px solid var(--danger-border);
      color: var(--danger-ink);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    /* Drawer Ranking Rows */
    .drawer-rule-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--ink-secondary);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .rank-list-item {
      width: 100%;
      border: 1.5px solid var(--border-soft);
      border-radius: 12px;
      background: var(--bg-surface);
      padding: 11px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .rank-list-item.place-1 {
      background: var(--gold-bg);
      border-color: var(--gold-border);
    }

    .rank-list-item.place-2 {
      background: var(--silver-bg);
      border-color: var(--silver-border);
    }

    .rank-list-item:hover {
      border-color: var(--brand);
    }

    /* Profile Standings Grid */
    .mini-standings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mini-standing-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .mini-standing-card.top-2 {
      background: var(--gold-bg);
      border-color: var(--gold-border);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 36px 20px;
      background: var(--bg-surface);
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      color: var(--ink-muted);
    }

    .empty-state h3 {
      margin: 10px 0 6px 0;
      color: var(--ink-primary);
      font-size: 16px;
      font-weight: 800;
    }

    .empty-state p {
      margin: 0 0 14px 0;
      font-size: 13.5px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(146px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #003B5C;
      color: #FFFFFF;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Print Preview Modal Content */
    .print-doc {
      background: #FFFFFF;
      color: #000000;
      font-size: 13px;
    }

    .print-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 12px;
    }

    .print-table th, .print-table td {
      border: 1px solid #CBD5E1;
      padding: 6px 8px;
      text-align: left;
    }

    .print-table th {
      background: #F1F5F9;
      font-weight: 800;
    }

    .print-void-row {
      text-decoration: line-through;
      color: #991B1B;
      background: #FEF2F2;
    }

    .hidden-print-root {
      display: none;
    }

    @media print {
      body {
        background: #FFFFFF !important;
      }
      .app-theme {
        display: none !important;
      }
      .hidden-print-root {
        display: block !important;
        padding: 16px;
        color: #000000;
        background: #FFFFFF;
      }
    }
  </style>
</head>

      /* =========================================================
         HELPERS & FORMATTING
      ========================================================= */
      function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function roundTo(val, decimals) {
        const f = Math.pow(10, decimals);
        return Math.round((Number(val) + Number.EPSILON) * f) / f;
      }

      function toCenti(val) {
        return Math.round(Number(val) * 100);
      }

      function toGrams(val) {
        return Math.round(Number(val) * 1000);
      }

      function formatLength(cm) {
        const n = roundTo(cm, 2);
        const s = n.toFixed(2);
        return s.endsWith('0') ? n.toFixed(1) : s;
      }

      function formatWeight(kg) {
        const n = roundTo(kg, 3);
        const s = n.toFixed(3);
        return s.endsWith('0') ? n.toFixed(2) : s;
      }

      function formatTime(iso) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      }

      function formatShortTime(iso) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function formatDateTime(iso) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        const day = d.toLocaleDateString([], { day: '2-digit', month: 'short' });
        return `${formatTime(iso)} · ${day}`;
      }

      function formatLogId(seq) {
        return 'LOG-' + String(seq).padStart(3, '0');
      }

      function generateId(prefix) {
        return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
      }

      function createEmptyDataset() {
        return {
          competitionName: 'Fishing Competition Scorer',
          anglers: [],
          catches: [],
          nextSeq: 1
        };
      }

      /* =========================================================
         STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
      ========================================================= */
      let store = {
        sampleMode: false,
        customLogoDataUrl: '',
        liveData: createEmptyDataset(),
        sampleData: buildSampleDataset()
      };

      const uiState = {
        activeTab: 'podium',
        divisionFilter: 'ALL',
        anglerSearch: '',
        auditFilter: 'ALL',
        auditSearch: '',
        auditSort: 'desc',
        liveClockTimer: null
      };

      function getDataset() {
        return store.sampleMode ? store.sampleData : store.liveData;
      }

      function applyHeaderLogo() {
        const img = document.getElementById('headerLogoImg');
        if (!img) return;
        img.onerror = function () {
          if (img.src !== DEFAULT_LOGO_DATA_URI) {
            img.src = DEFAULT_LOGO_DATA_URI;
          }
        };
        img.src = store.customLogoDataUrl || DEFAULT_LOGO_DATA_URI;
      }

      function loadStore() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.liveData) {
              store.sampleMode = Boolean(parsed.sampleMode);
              store.customLogoDataUrl = typeof parsed.customLogoDataUrl === 'string' ? parsed.customLogoDataUrl : '';
              store.liveData = parsed.liveData;
              if (store.liveData.competitionName === 'TideLine Comp Scorer' || store.liveData.competitionName === 'OzFish Comp Scorer') {
                store.liveData.competitionName = 'Fishing Competition Scorer';
              }
              store.sampleData = parsed.sampleData || buildSampleDataset();
            }
          }
        } catch (err) {
          console.warn('Storage unavailable, using in-memory session.', err);
        }
      }

      function saveStore() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        } catch (err) {
          console.warn('Could not persist to localStorage:', err);
        }
      }

      /* =========================================================
         AUTOMATED SCORING & TIE-BREAKER ENGINE
      ========================================================= */
      function computeAllStats(dataset, divisionFilter) {
        const anglers = dataset.anglers.filter(a => divisionFilter === 'ALL' || a.division === divisionFilter);
        const anglerMap = new Map();
        anglers.forEach(a => anglerMap.set(a.id, a));

        const activeCatches = dataset.catches.filter(c => c.status !== 'voided' && anglerMap.has(c.anglerId));
        const allAnglerStats = new Map();

        anglers.forEach(a => {
          allAnglerStats.set(a.id, {
            angler: a,
            catches: [],
            count: 0,
            totalWeightGrams: 0,
            totalLengthCenti: 0,
            totalWeightKg: 0,
            totalLengthCm: 0,
            bestLengthCatch: null,
            bestWeightCatch: null,
            lastCatchTime: Infinity
          });
        });

        activeCatches.forEach(c => {
          const st = allAnglerStats.get(c.anglerId);
          if (!st) return;
          st.catches.push(c);
          st.count += 1;
          st.totalWeightGrams += toGrams(c.weightKg);
          st.totalLengthCenti += toCenti(c.lengthCm);

          const cTime = Date.parse(c.timestamp) || 0;

          // Best single length catch: longest, then earliest timestamp, then heaviest
          if (!st.bestLengthCatch) {
            st.bestLengthCatch = c;
          } else {
            const b = st.bestLengthCatch;
            const bTime = Date.parse(b.timestamp) || 0;
            if (
              toCenti(c.lengthCm) > toCenti(b.lengthCm) ||
              (toCenti(c.lengthCm) === toCenti(b.lengthCm) && cTime < bTime) ||
              (toCenti(c.lengthCm) === toCenti(b.lengthCm) && cTime === bTime && toGrams(c.weightKg) > toGrams(b.weightKg))
            ) {
              st.bestLengthCatch = c;
            }
          }

          // Best single weight catch: heaviest, then earliest timestamp, then longest
          if (!st.bestWeightCatch) {
            st.bestWeightCatch = c;
          } else {
            const b = st.bestWeightCatch;
            const bTime = Date.parse(b.timestamp) || 0;
            if (
              toGrams(c.weightKg) > toGrams(b.weightKg) ||
              (toGrams(c.weightKg) === toGrams(b.weightKg) && cTime < bTime) ||
              (toGrams(c.weightKg) === toGrams(b.weightKg) && cTime === bTime && toCenti(c.lengthCm) > toCenti(b.lengthCm))
            ) {
              st.bestWeightCatch = c;
            }
          }
        });

        allAnglerStats.forEach(st => {
          st.totalWeightKg = st.totalWeightGrams / 1000;
          st.totalLengthCm = st.totalLengthCenti / 100;
          if (st.catches.length > 0) {
            st.lastCatchTime = Math.max(...st.catches.map(c => Date.parse(c.timestamp) || 0));
          }
        });

        const rankedAnglerList = Array.from(allAnglerStats.values()).filter(st => st.count > 0);
        const unrankedAnglers = Array.from(allAnglerStats.values())
          .filter(st => st.count === 0)
          .sort((a, b) => a.angler.name.localeCompare(b.angler.name));

        function buildCategoryRanking(catId) {
          let entries = [];

          if (catId === 'longest_single') {
            entries = rankedAnglerList.map(st => ({
              angler: st.angler,
              stats: st,
              catchRef: st.bestLengthCatch,
              primaryRaw: toCenti(st.bestLengthCatch.lengthCm),
              primaryDisplay: formatLength(st.bestLengthCatch.lengthCm),
              unit: 'cm',
              meta: `${st.bestLengthCatch.species || 'Unlisted'} · ${formatShortTime(st.bestLengthCatch.timestamp)}`
            }));

            entries.sort((a, b) => {
              if (b.primaryRaw !== a.primaryRaw) return b.primaryRaw - a.primaryRaw;
              const tA = Date.parse(a.catchRef.timestamp) || 0;
              const tB = Date.parse(b.catchRef.timestamp) || 0;
              if (tA !== tB) return tA - tB;
              const wA = toGrams(a.catchRef.weightKg);
              const wB = toGrams(b.catchRef.weightKg);
              if (wB !== wA) return wB - wA;
              if (b.stats.totalWeightGrams !== a.stats.totalWeightGrams) return b.stats.totalWeightGrams - a.stats.totalWeightGrams;
              return a.angler.badge.localeCompare(b.angler.badge);
            });
          } else if (catId === 'heaviest_single') {
            entries = rankedAnglerList.map(st => ({
              angler: st.angler,
              stats: st,
              catchRef: st.bestWeightCatch,
              primaryRaw: toGrams(st.bestWeightCatch.weightKg),
              primaryDisplay: formatWeight(st.bestWeightCatch.weightKg),
              unit: 'kg',
              meta: `${st.bestWeightCatch.species || 'Unlisted'} · ${formatShortTime(st.bestWeightCatch.timestamp)}`
            }));

            entries.sort((a, b) => {
              if (b.primaryRaw !== a.primaryRaw) return b.primaryRaw - a.primaryRaw;
              const tA = Date.parse(a.catchRef.timestamp) || 0;
              const tB = Date.parse(b.catchRef.timestamp) || 0;
              if (tA !== tB) return tA - tB;
              const lA = toCenti(a.catchRef.lengthCm);
              const lB = toCenti(b.catchRef.lengthCm);
              if (lB !== lA) return lB - lA;
              if (b.stats.totalLengthCenti !== a.stats.totalLengthCenti) return b.stats.totalLengthCenti - a.stats.totalLengthCenti;
              return a.angler.badge.localeCompare(b.angler.badge);
            });
          } else if (catId === 'most_fish') {
            entries = rankedAnglerList.map(st => ({
              angler: st.angler,
              stats: st,
              catchRef: null,
              primaryRaw: st.count,
              primaryDisplay: String(st.count),
              unit: st.count === 1 ? 'fish' : 'fish',
              meta: `Total ${formatWeight(st.totalWeightKg)} kg · ${formatLength(st.totalLengthCm)} cm`
            }));

            entries.sort((a, b) => {
              if (b.primaryRaw !== a.primaryRaw) return b.primaryRaw - a.primaryRaw;
              if (b.stats.totalWeightGrams !== a.stats.totalWeightGrams) return b.stats.totalWeightGrams - a.stats.totalWeightGrams;
              if (b.stats.totalLengthCenti !== a.stats.totalLengthCenti) return b.stats.totalLengthCenti - a.stats.totalLengthCenti;
              if (a.stats.lastCatchTime !== b.stats.lastCatchTime) return a.stats.lastCatchTime - b.stats.lastCatchTime;
              return a.angler.badge.localeCompare(b.angler.badge);
            });
          } else if (catId === 'combined_weight') {
            entries = rankedAnglerList.map(st => ({
              angler: st.angler,
              stats: st,
              catchRef: null,
              primaryRaw: st.totalWeightGrams,
              primaryDisplay: formatWeight(st.totalWeightKg),
              unit: 'kg',
              meta: `${st.count} ${st.count === 1 ? 'fish' : 'fish'} · Best ${formatWeight(st.bestWeightCatch.weightKg)} kg`
            }));

            entries.sort((a, b) => {
              if (b.primaryRaw !== a.primaryRaw) return b.primaryRaw - a.primaryRaw;
              const bwA = toGrams(a.stats.bestWeightCatch.weightKg);
              const bwB = toGrams(b.stats.bestWeightCatch.weightKg);
              if (bwB !== bwA) return bwB - bwA;
              if (b.stats.totalLengthCenti !== a.stats.totalLengthCenti) return b.stats.totalLengthCenti - a.stats.totalLengthCenti;
              if (a.stats.lastCatchTime !== b.stats.lastCatchTime) return a.stats.lastCatchTime - b.stats.lastCatchTime;
              return a.angler.badge.localeCompare(b.angler.badge);
            });
          } else if (catId === 'combined_length') {
            entries = rankedAnglerList.map(st => ({
              angler: st.angler,
              stats: st,
              catchRef: null,
              primaryRaw: st.totalLengthCenti,
              primaryDisplay: formatLength(st.totalLengthCm),
              unit: 'cm',
              meta: `${st.count} ${st.count === 1 ? 'fish' : 'fish'} · Best ${formatLength(st.bestLengthCatch.lengthCm)} cm`
            }));

            entries.sort((a, b) => {
              if (b.primaryRaw !== a.primaryRaw) return b.primaryRaw - a.primaryRaw;
              const blA = toCenti(a.stats.bestLengthCatch.lengthCm);
              const blB = toCenti(b.stats.bestLengthCatch.lengthCm);
              if (blB !== blA) return blB - blA;
              if (b.stats.totalWeightGrams !== a.stats.totalWeightGrams) return b.stats.totalWeightGrams - a.stats.totalWeightGrams;
              if (a.stats.lastCatchTime !== b.stats.lastCatchTime) return a.stats.lastCatchTime - b.stats.lastCatchTime;
              return a.angler.badge.localeCompare(b.angler.badge);
            });
          }

          // Detect ties on primaryRaw and attach explicit tie-breaker reason
          const groups = new Map();
          entries.forEach(e => {
            if (!groups.has(e.primaryRaw)) groups.set(e.primaryRaw, []);
            groups.get(e.primaryRaw).push(e);
          });

          entries.forEach((e, idx) => {
            e.rank = idx + 1;
            const grp = groups.get(e.primaryRaw);
            if (grp && grp.length > 1) {
              e.tieBreakerApplied = true;
              e.tieBreakerReason = describeTieBreaker(catId, e, grp);
            } else {
              e.tieBreakerApplied = false;
              e.tieBreakerReason = '';
            }
          });

          return {
            categoryId: catId,
            entries,
            unranked: unrankedAnglers
          };
        }

        function describeTieBreaker(catId, entry, tiedGroup) {
          if (catId === 'longest_single') {
            const times = new Set(tiedGroup.map(x => Date.parse(x.catchRef.timestamp)));
            if (times.size > 1) return `TB: Time ${formatShortTime(entry.catchRef.timestamp)}`;
            const weights = new Set(tiedGroup.map(x => toGrams(x.catchRef.weightKg)));
            if (weights.size > 1) return `TB: Fish ${formatWeight(entry.catchRef.weightKg)} kg`;
            return `TB: Total ${formatWeight(entry.stats.totalWeightKg)} kg`;
          }
          if (catId === 'heaviest_single') {
            const times = new Set(tiedGroup.map(x => Date.parse(x.catchRef.timestamp)));
            if (times.size > 1) return `TB: Time ${formatShortTime(entry.catchRef.timestamp)}`;
            const lengths = new Set(tiedGroup.map(x => toCenti(x.catchRef.lengthCm)));
            if (lengths.size > 1) return `TB: Fish ${formatLength(entry.catchRef.lengthCm)} cm`;
            return `TB: Total ${formatLength(entry.stats.totalLengthCm)} cm`;
          }
          if (catId === 'most_fish') {
            const weights = new Set(tiedGroup.map(x => x.stats.totalWeightGrams));
            if (weights.size > 1) return `TB: Total ${formatWeight(entry.stats.totalWeightKg)} kg`;
            const lengths = new Set(tiedGroup.map(x => x.stats.totalLengthCenti));
            if (lengths.size > 1) return `TB: Total ${formatLength(entry.stats.totalLengthCm)} cm`;
            return `TB: Earlier finish`;
          }
          if (catId === 'combined_weight') {
            const bestW = new Set(tiedGroup.map(x => toGrams(x.stats.bestWeightCatch.weightKg)));
            if (bestW.size > 1) return `TB: Best ${formatWeight(entry.stats.bestWeightCatch.weightKg)} kg`;
            const lengths = new Set(tiedGroup.map(x => x.stats.totalLengthCenti));
            if (lengths.size > 1) return `TB: Total ${formatLength(entry.stats.totalLengthCm)} cm`;
            return `TB: Earlier finish`;
          }
          if (catId === 'combined_length') {
            const bestL = new Set(tiedGroup.map(x => toCenti(x.stats.bestLengthCatch.lengthCm)));
            if (bestL.size > 1) return `TB: Best ${formatLength(entry.stats.bestLengthCatch.lengthCm)} cm`;
            const weights = new Set(tiedGroup.map(x => x.stats.totalWeightGrams));
            if (weights.size > 1) return `TB: Total ${formatWeight(entry.stats.totalWeightKg)} kg`;
            return `TB: Earlier finish`;
          }
          return 'TB Applied';
        }

        const leaderboards = {};
        CATEGORIES.forEach(cat => {
          leaderboards[cat.id] = buildCategoryRanking(cat.id);
        });

        // Map each angler's podium counts
        const podiumMap = new Map();
        anglers.forEach(a => podiumMap.set(a.id, { firsts: 0, seconds: 0, ranks: {} }));
        CATEGORIES.forEach(cat => {
          leaderboards[cat.id].entries.forEach(e => {
            const pm = podiumMap.get(e.angler.id);
            if (!pm) return;
            pm.ranks[cat.id] = { rank: e.rank, value: `${e.primaryDisplay} ${e.unit}`, tb: e.tieBreakerReason };
            if (e.rank === 1) pm.firsts += 1;
            if (e.rank === 2) pm.seconds += 1;
          });
        });

        return {
          allAnglerStats,
          leaderboards,
          podiumMap,
          activeCatchCount: activeCatches.length
        };
      }

      /* =========================================================
         RENDERING: HEADER & TABS
      ========================================================= */
      function renderApp() {
        const ds = getDataset();
        const activeCount = ds.catches.filter(c => c.status !== 'voided').length;
        const voidCount = ds.catches.length - activeCount;

        document.getElementById('headerCompTitle').textContent = ds.competitionName || 'Fishing Competition Scorer';
        document.getElementById('headerStats').textContent =
          `${ds.anglers.length} ${ds.anglers.length === 1 ? 'angler' : 'anglers'} · ${activeCount} active` +
          (voidCount > 0 ? ` · ${voidCount} void` : '');

        document.getElementById('sampleBanner').style.display = store.sampleMode ? 'flex' : 'none';

        // Update nav tabs
        document.querySelectorAll('.nav-tab').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === uiState.activeTab);
        });

        // Ensure current divisionFilter is still valid
        const divs = getAvailableDivisions(ds);
        if (uiState.divisionFilter !== 'ALL' && !divs.includes(uiState.divisionFilter)) {
          uiState.divisionFilter = 'ALL';
        }

        const main = document.getElementById('mainContent');
        if (uiState.activeTab === 'podium') {
          main.innerHTML = renderPodiumTab(ds);
          bindPodiumEvents();
        } else if (uiState.activeTab === 'anglers') {
          main.innerHTML = renderAnglersTab(ds);
          bindAnglersEvents();
        } else {
          main.innerHTML = renderAuditTab(ds);
          bindAuditEvents();
        }
      }

      function getAvailableDivisions(ds) {
        const set = new Set();
        ds.anglers.forEach(a => {
          if (a.division && a.division.trim()) set.add(a.division.trim());
        });
        return Array.from(set);
      }

      function renderDivisionFilterBar(ds) {
        const divs = getAvailableDivisions(ds);
        if (divs.length === 0) return '';
        const hasUndivided = ds.anglers.some(a => !a.division || !a.division.trim());
        if (divs.length === 1 && !hasUndivided) return '';
        return `
          <div class="filter-strip" aria-label="Filter by Division">
            <button type="button" class="chip-btn ${uiState.divisionFilter === 'ALL' ? 'active' : ''}" data-div="ALL">All</button>
            ${divs.map(d => `
              <button type="button" class="chip-btn ${uiState.divisionFilter === d ? 'active' : ''}" data-div="${escapeHtml(d)}">${escapeHtml(d)}</button>
            `).join('')}
          </div>
        `;
      }

      /* =========================================================
         TAB 1: PODIUM (SUMMARY VIEW)
      ========================================================= */
      function renderPodiumTab(ds) {
        const computed = computeAllStats(ds, uiState.divisionFilter);

        if (ds.anglers.length === 0) {
          return `
            <div class="empty-state">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0082BA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                <path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
              </svg>
              <h3>Ready for Weigh-In</h3>
              <p>Register anglers and tap <strong>+ Catch</strong> to start live competition scoring.</p>
              <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                <button type="button" class="btn btn-primary" id="emptyRegBtn">+ Register Angler</button>
              </div>
            </div>
          `;
        }

        const cardsHtml = CATEGORIES.map(cat => {
          const lb = computed.leaderboards[cat.id];
          const first = lb.entries[0] || null;
          const second = lb.entries[1] || null;
          const countLabel = lb.entries.length > 0 ? `${lb.entries.length} ranked` : 'No catches';

          return `
            <button type="button" class="podium-card" data-open-category="${cat.id}">
              <div class="podium-card-header">
                <div class="podium-cat-title">
                  <span class="cat-icon" aria-hidden="true">${cat.icon}</span>
                  <span>${escapeHtml(cat.title)}</span>
                </div>
                <span class="podium-expand-hint">
                  <span>${countLabel}</span>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </span>
              </div>
              <div class="podium-rows">
                ${renderPodiumRow(first, 1)}
                ${renderPodiumRow(second, 2)}
              </div>
            </button>
          `;
        }).join('');

        return `
          ${renderDivisionFilterBar(ds)}
          <div class="podium-grid">
            ${cardsHtml}
          </div>
        `;
      }

      function renderPodiumRow(entry, place) {
        const badgeLabel = place === 1 ? '1ST' : '2ND';
        const badgeClass = place === 1 ? 'rank-1' : 'rank-2';
        const rowClass = place === 1 ? 'place-1' : 'place-2';

        if (!entry) {
          return `
            <div class="podium-row ${rowClass}">
              <div class="empty-slot" style="padding:0;">
                <span class="rank-badge ${badgeClass}">${badgeLabel}</span>
                <span>Awaiting qualifying catch...</span>
              </div>
            </div>
          `;
        }

        const tbHtml = entry.tieBreakerApplied
          ? `<span class="tb-badge" title="Tie-breaker applied">${escapeHtml(entry.tieBreakerReason)}</span>`
          : '';

        return `
          <div class="podium-row ${rowClass}">
            <div class="podium-left">
              <span class="rank-badge ${badgeClass}">${badgeLabel}</span>
              <div class="podium-angler-info">
                <div class="podium-name-line">
                  <span class="podium-angler-name">${escapeHtml(entry.angler.name)}</span>
                  <span class="badge-tag mono">#${escapeHtml(entry.angler.badge)}</span>
                </div>
                <div class="podium-meta">
                  <span>${escapeHtml(entry.meta)}</span>
                  ${tbHtml}
                </div>
              </div>
            </div>
            <div class="podium-score tabular">
              <span class="score-value">${escapeHtml(entry.primaryDisplay)}</span><span class="score-unit">${escapeHtml(entry.unit)}</span>
            </div>
          </div>
        `;
      }

      function bindPodiumEvents() {
        document.querySelectorAll('[data-div]').forEach(btn => {
          btn.addEventListener('click', () => {
            uiState.divisionFilter = btn.dataset.div;
            renderApp();
          });
        });

        document.querySelectorAll('[data-open-category]').forEach(card => {
          card.addEventListener('click', () => {
            openCategoryDrawer(card.dataset.openCategory);
          });
        });

        const emptyReg = document.getElementById('emptyRegBtn');
        if (emptyReg) emptyReg.addEventListener('click', () => openAnglerFormModal(null));
      }

      /* =========================================================
         TAB 2: ANGLERS (ROSTER VIEW)
      ========================================================= */
      function renderAnglersTab(ds) {
        const computed = computeAllStats(ds, 'ALL');
        const query = uiState.anglerSearch.trim().toLowerCase();

        const filtered = ds.anglers
          .filter(a => uiState.divisionFilter === 'ALL' || a.division === uiState.divisionFilter)
          .filter(a => {
            if (!query) return true;
            return (
              a.name.toLowerCase().includes(query) ||
              a.badge.toLowerCase().includes(query) ||
              (a.division || '').toLowerCase().includes(query)
            );
          })
          .sort((a, b) => {
            const stA = computed.allAnglerStats.get(a.id);
            const stB = computed.allAnglerStats.get(b.id);
            const cA = stA ? stA.count : 0;
            const cB = stB ? stB.count : 0;
            if (cB !== cA) return cB - cA;
            return a.name.localeCompare(b.name);
          });

        const listHtml = filtered.length === 0
          ? `
            <div class="empty-state">
              <h3>${ds.anglers.length === 0 ? 'No Anglers Registered' : 'No Matching Anglers'}</h3>
              <p>${ds.anglers.length === 0 ? 'Add competitors with their badge ID (and optional division) to begin logging catches.' : 'Try clearing your search or division filter.'}</p>
              ${ds.anglers.length === 0 ? '<button type="button" class="btn btn-primary" id="emptyAnglerAddBtn">+ Register First Angler</button>' : ''}
            </div>
          `
          : `
            <div class="list-stack">
              ${filtered.map(a => {
                const st = computed.allAnglerStats.get(a.id) || { count: 0, totalWeightKg: 0, totalLengthCm: 0 };
                const pm = computed.podiumMap.get(a.id) || { firsts: 0, seconds: 0 };
                const podiumLabels = [];
                if (pm.firsts > 0) podiumLabels.push(`${pm.firsts}× 1st`);
                if (pm.seconds > 0) podiumLabels.push(`${pm.seconds}× 2nd`);
                const divClass = (a.division || '').toLowerCase() === 'junior' ? 'junior' : '';
                const divBadgeHtml = a.division ? `<span class="div-pill ${divClass}">${escapeHtml(a.division)}</span>` : '';

                return `
                  <button type="button" class="angler-card" data-open-angler="${a.id}">
                    <div class="angler-card-top">
                      <div>
                        <div class="angler-name">${escapeHtml(a.name)}</div>
                        <div style="display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;">
                          <span class="badge-tag mono">#${escapeHtml(a.badge)}</span>
                          ${divBadgeHtml}
                        </div>
                      </div>
                      ${podiumLabels.length > 0 ? `<span class="podium-count-pill">${escapeHtml(podiumLabels.join(' · '))}</span>` : ''}
                    </div>
                    <div class="angler-stats-grid tabular">
                      <div>
                        <div class="stat-cell-label">Fish</div>
                        <div class="stat-cell-val">${st.count}</div>
                      </div>
                      <div>
                        <div class="stat-cell-label">Total Weight</div>
                        <div class="stat-cell-val">${formatWeight(st.totalWeightKg)} kg</div>
                      </div>
                      <div>
                        <div class="stat-cell-label">Total Length</div>
                        <div class="stat-cell-val">${formatLength(st.totalLengthCm)} cm</div>
                      </div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          `;

        return `
          <div class="toolbar-row">
            <div class="search-box">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="search" id="anglerSearchInput" class="input-field search-input" placeholder="Search name or badge #..." value="${escapeHtml(uiState.anglerSearch)}" />
            </div>
            <button type="button" class="btn btn-dark" id="registerAnglerBtn">+ Register</button>
          </div>
          ${renderDivisionFilterBar(ds)}
          ${listHtml}
        `;
      }

      function bindAnglersEvents() {
        const searchInput = document.getElementById('anglerSearchInput');
        if (searchInput) {
          searchInput.addEventListener('input', e => {
            uiState.anglerSearch = e.target.value;
            const pos = e.target.selectionStart;
            renderApp();
            const refreshed = document.getElementById('anglerSearchInput');
            if (refreshed) {
              refreshed.focus();
              refreshed.setSelectionRange(pos, pos);
            }
          });
        }

        const regBtn = document.getElementById('registerAnglerBtn');
        if (regBtn) regBtn.addEventListener('click', () => openAnglerFormModal(null));

        const emptyBtn = document.getElementById('emptyAnglerAddBtn');
        if (emptyBtn) emptyBtn.addEventListener('click', () => openAnglerFormModal(null));

        document.querySelectorAll('[data-div]').forEach(btn => {
          btn.addEventListener('click', () => {
            uiState.divisionFilter = btn.dataset.div;
            renderApp();
          });
        });

        document.querySelectorAll('[data-open-angler]').forEach(card => {
          card.addEventListener('click', () => openAnglerProfileDrawer(card.dataset.openAngler));
        });
